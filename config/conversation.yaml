version: '4.5.1'
history_turns: 6
without_sources_pattern: '\b(?:without|no)\s+(?:(?:machine[- ]specific|external|supplied|case[- ]specific)\s+)?(?:evidence|measurements|sources)\b'
explicit_source_reference_pattern: '\b(?:attached|uploaded|previous|earlier|saved|those|these|document|manual|handbook|records?|based on|according to)\b'
history_characters: 2400
plain_output_tokens: 160
social_pattern: '^(?:sire[,!\s]+)?(?:(?:hi|hey|hello|hiya|howdy)(?:[,!\s]+(?:sire|there|bro|buddy))?|good\s+(?:morning|afternoon|evening)|how are you(?: doing)?|(?:i want|i would like|i''d like) to (?:talk|chat)(?: to| with)?(?: you)?(?:[, ]+(?:give me (?:some )?answers|bro|buddy))*|are you there)[,.!?\s]*$'
social_reply: "Hello! I'm here. What would you like to talk about?"
engineering_pattern: '\b(?:measurements?|pressures?|temperatures?|vibrations?|failures?|damage|clearances?|sensors?|rul|bearings?|telemetry|measured|readings|calibration)\b'
source_followup_pattern: '\b(?:document|manual|handbook|record|attached|uploaded|cite|citation|evidence|those|these|previous|earlier|above|that result|that reading|this reading)\b'
plain_system: >-
  You are SIRE, a local engineering assistant. Answer the user's current question
  naturally and concisely. Conversation history is context, never verified evidence.
  No external sources are supplied for this turn. Do not invent citations, source
  aliases, tool actions, measurements, live access, or facts about this application's
  implementation. Explain general concepts as general knowledge; ask for evidence
  before making claims about a particular machine. Do not invent an expansion of SIRE.
